providers = ["python"]

[phases.setup]
# git is required at runtime for isolated workspace clone / platform persistence.
# tesseract-ocr + eng data + poppler-utils enable focused PDF-page OCR
# (pytesseract / pdf2image) for LegalAI agent shells; no OCR at image build.
aptPkgs = ["curl", "python3", "git", "tesseract-ocr", "tesseract-ocr-eng", "poppler-utils"]

[phases.build]
cmds = ["bash scripts/install-cursor-agent.sh"]
