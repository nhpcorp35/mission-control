name: Case-00 PR 22 validation

on:
  push:
    branches:
      - agent/case00-attorney-review-packet

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .legalai_work/nhpcorp35-legal-ai-2b3c660
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .legalai_work/nhpcorp35-legal-ai-2b3c660/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate syntax
        run: |
          python -m py_compile case00_attorney_eval/review_packet.py
          python -m py_compile scripts/run_case00_generate_and_evaluate.py

      - name: Run focused review packet tests
        run: python -m unittest -v test_case00_attorney_review_packet.py

      - name: Run generate-and-evaluate tests
        run: python -m unittest -v test_case00_generate_and_evaluate.py

      - name: Run evaluator and diagnostics regressions
        run: python -m unittest -v test_case00_attorney_eval.py test_case00_diagnostics.py
