name: Case-00 question retrieval tests

on:
  pull_request:
    paths:
      - "github_actions_bridge/**"
      - "hal_legalai_gateway/**"
      - "tests/test_github_actions_bridge_storage.py"
      - ".github/workflows/case00-question-retrieval.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r github_actions_bridge/requirements.txt -r hal_legalai_gateway/requirements.txt
      - run: python -m unittest -v tests.test_github_actions_bridge_storage tests.test_hal_legalai_gateway
